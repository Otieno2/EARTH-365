services:
  postgres:
    image: postgres:16-alpine
    container_name: earth365-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: earth365
      POSTGRES_PASSWORD: earth365_dev_password
      POSTGRES_DB: earth365
    ports:
      - "5432:5432"
    volumes:
      - earth365_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earth365 -d earth365"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: earth365-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - earth365_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  earth365_pgdata:
  earth365_redisdata:
